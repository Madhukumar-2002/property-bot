[build]
builder = "NIXPACKS.Builder"

[build.dockerfile]
enabled = false

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
startCommand = "npm start"

[env]
NODE_ENV = "production"
PORT = "8080"

[[env]]
name = "WHATSAPP_TOKEN"
value = "${WHATSAPP_TOKEN}"

[[env]]
name = "WHATSAPP_PHONE_ID"
value = "${WHATSAPP_PHONE_ID}"

[[env]]
name = "VERIFY_TOKEN"
value = "${VERIFY_TOKEN}"

[[env]]
name = "MONGO_URI"
value = "${MONGO_URI}"
